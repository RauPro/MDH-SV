[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0", "packaging==26.3"]
build-backend = "setuptools.build_meta"

# Checkout application: scripts/bootstrap.py installs requirements.lock.txt before
# registering editable modules. Standalone wheels do not include the datasets.
[project]
name = "mdh-sv"
version = "2.1.0"
description = "Monitor de Violaciones a Derechos Humanos en El Salvador - Open Data, AI & MCP"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
authors = [
    { name = "Raul Guillen" }
]

[tool.setuptools.packages.find]
where = ["packages/schema/src", "apps/pipeline/src", "apps/mcp/src"]

[tool.setuptools.package-data]
mdh_pipeline = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "packages/schema/src",
    "apps/pipeline/src",
    "apps/mcp/src"
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

# Explicit correctness baseline, independent of user-level Ruff settings.
[tool.ruff.lint]
select = ["E4", "E9", "F", "B023"]

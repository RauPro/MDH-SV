name: Refresh public news bibliography
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: Máximo de páginas por medio (1 a 1000; reanuda en la siguiente ejecución)
        type: number
        required: true
        default: 150
permissions:
  contents: read
concurrency:
  group: public-news-bibliography
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'RauPro/MDH-SV' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned secret scanner
        run: python scripts/install_gitleaks.py --destination "$RUNNER_TEMP/mdh-gitleaks" >> "$GITHUB_PATH"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          npm --prefix apps/web ci
      - name: Read publisher metadata and resume incomplete months
        id: collect
        timeout-minutes: 20
        continue-on-error: true
        env:
          MDH_MAX_PAGES: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.max_pages) || '150' }}
        run: python -m mdh_pipeline.history --max-pages "$MDH_MAX_PAGES"
      - name: Finalize coverage from saved checkpoints
        run: python -m mdh_pipeline.history --export-only
      - name: Verify bibliography publication boundary
        run: |
          pytest -q tests/test_history.py tests/test_archive_sources.py
          node apps/web/scripts/sync-news-publication.mjs
          node apps/web/scripts/sync-news-processing.mjs
          npm --prefix apps/web test -- src/newsArchive.test.ts
      - name: Propose bibliography and coverage update
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_BRANCH: chore/automated-history-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/history/co-latino.json data/history/gatoencerrado.json data/history/factum.json data/history/el-faro.json data/history/el-mundo.json data/history/la-prensa-grafica.json data/history/el-diario-de-hoy.json apps/web/public/archive/news.json apps/web/public/archive/processing.json apps/web/public/archive/dossiers.json apps/web/public/archive/locations.json data/automated/news_dossiers.json
          if git diff --cached --quiet; then exit 0; fi
          git switch -c "$PUBLICATION_BRANCH"
          git commit -m 'chore: refresh news bibliography and source coverage'
          python scripts/publication_guard.py check --ref HEAD
          git push origin "HEAD:refs/heads/$PUBLICATION_BRANCH"
          python -m mdh_pipeline.publication_pr propose --kind history --branch "$PUBLICATION_BRANCH"
      - name: Report incomplete collection after preserving progress
        if: steps.collect.outcome == 'failure'
        run: exit 1

name: Recoger noticias
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: editorial-inbox
  cancel-in-progress: false
  queue: max
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RauPro/MDH-SV
          ref: MDH_PUBLIC_CODE_REF
          path: monitor
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: monitor/ops/review-queue/requirements.txt
      - run: pip install -r monitor/ops/review-queue/requirements.txt
      - name: Registrar candidatos en la cola privada
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: python -m mdh_pipeline.review_queue collect

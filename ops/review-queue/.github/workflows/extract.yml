name: Preparar fichas con Gemini
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: Techo de solicitudes para clasificación y fichas (1 a 50; respeta la cuota horaria)
        type: number
        default: 16
        required: true
      scheduled_hour:
        description: Hora UTC solicitada por el planificador (YYYY-MM-DDTHH:00:00Z; vacía para manual)
        type: string
        required: false
      trigger_source:
        description: Origen del disparo; todos comparten una única ejecución por hora UTC
        type: choice
        options:
          - manual
          - vercel_cron
        default: manual
        required: false
      retry_failed:
        description: Reintentar errores pendientes aunque hayan agotado los intentos ordinarios
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: editorial-inbox
  cancel-in-progress: false
  queue: max
jobs:
  extract:
    if: vars.MDH_AUTOMATION_ENABLED == 'true' && github.repository == 'RauPro/MDH-SV-review' && github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descartar un disparo programado entregado fuera de su hora
        id: window
        env:
          MDH_EVENT_NAME: ${{ github.event_name }}
          MDH_SCHEDULE: ${{ github.event.schedule }}
        run: |
          on_time=true
          if [ "$MDH_EVENT_NAME" = schedule ]; then
            on_time=$(printf '%s\n' "$MDH_SCHEDULE" | awk -v now="$(date -u +%H:%M)" '{split(now, t, ":"); n = split($2, h, ","); ok = "false"; if (t[2] + 0 < 45) for (i = 1; i <= n; i++) if (h[i] ~ /^[0-9]+$/ && h[i] + 0 == t[1] + 0) ok = "true"; print ok}')
            if [ "$on_time" != true ]; then
              on_time=false
              echo "GitHub entregó el disparo programado fuera de su ventana (una hora del cron, antes del minuto 45); termina sin reclamar franja ni llamar a Gemini."
            fi
          fi
          echo "on_time=$on_time" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.window.outputs.on_time == 'true'
        with:
          repository: RauPro/MDH-SV
          ref: MDH_PUBLIC_CODE_REF
          path: monitor
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.window.outputs.on_time == 'true'
        with:
          repository: RauPro/MDH-SV
          ref: main
          path: bibliography
          sparse-checkout: |
            data/history
            data/selection
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.window.outputs.on_time == 'true'
        with:
          ref: main
          path: inbox
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.window.outputs.on_time == 'true'
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: monitor/ops/review-queue/requirements.txt
      - name: Instalar entorno fijado
        if: steps.window.outputs.on_time == 'true'
        run: pip install -r monitor/ops/review-queue/requirements.txt
      - name: Preparar candidatos fuera del archivo público seleccionado
        if: steps.window.outputs.on_time == 'true'
        env:
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: python -m mdh_pipeline.history --export-only --candidates-only --data-dir bibliography/data/history --output candidates.json
      - name: Recoger las noticias nuevas
        if: steps.window.outputs.on_time == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: python -m mdh_pipeline.review_queue collect
      - name: Preparar fichas de noticia y migrar borradores previos sin publicarlos
        if: steps.window.outputs.on_time == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MDH_CODE_REF: MDH_PUBLIC_CODE_REF
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          MDH_GEMINI_BUDGET_CONFIG: ${{ vars.MDH_GEMINI_BUDGET_CONFIG }}
          MDH_BATCH_SIZE: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.batch_size) || '16' }}
          MDH_RETRY_FAILED: ${{ inputs.retry_failed || false }}
          MDH_SCHEDULED_HOUR: ${{ inputs.scheduled_hour || '' }}
          MDH_TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: |
          args=(--archive candidates.json --limit "$MDH_BATCH_SIZE" --scope-first --inbox-dir inbox --exceptions bibliography/data/selection/news_exceptions.json --scope-audits bibliography/data/selection/scope_audits.json)
          if [ "$MDH_RETRY_FAILED" = 'true' ]; then args+=(--retry-failed); fi
          python -m mdh_pipeline.gemini_review "${args[@]}"

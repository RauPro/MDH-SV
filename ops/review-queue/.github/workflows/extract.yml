name: Preparar fichas con Gemini
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: Máximo de noticias por lote (1 a 50)
        type: number
        default: 50
        required: true
      scheduled_hour:
        description: Hora UTC solicitada por el planificador (YYYY-MM-DDTHH:00:00Z; vacía para manual)
        type: string
        required: false
      trigger_source:
        description: Origen del disparo; todos comparten una única ejecución por hora UTC
        type: choice
        options:
          - manual
          - vercel_cron
        default: manual
        required: false
      retry_failed:
        description: Reintentar errores pendientes aunque hayan agotado los intentos ordinarios
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: editorial-inbox
  cancel-in-progress: false
  queue: max
jobs:
  extract:
    if: github.event.repository.private == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RauPro/MDH-SV
          ref: MDH_PUBLIC_CODE_REF
          path: monitor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: RauPro/MDH-SV
          ref: main
          path: bibliography
          sparse-checkout: apps/web/public/archive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: monitor/ops/review-queue/requirements.txt
      - name: Instalar entorno fijado
        run: pip install -r monitor/ops/review-queue/requirements.txt
      - name: Recoger las noticias nuevas
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: python -m mdh_pipeline.review_queue collect
      - name: Incorporar noticias de todos los ámbitos con cuotas de revisión
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: python -m mdh_pipeline.history_review --archive bibliography/apps/web/public/archive/news.json --limit 50 --include-international
      - name: Preparar fichas de noticia y migrar borradores previos sin publicarlos
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MDH_CODE_REF: MDH_PUBLIC_CODE_REF
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          MDH_GEMINI_BUDGET_CONFIG: ${{ vars.MDH_GEMINI_BUDGET_CONFIG }}
          MDH_BATCH_SIZE: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.batch_size) || '50' }}
          MDH_RETRY_FAILED: ${{ inputs.retry_failed || false }}
          MDH_SCHEDULED_HOUR: ${{ inputs.scheduled_hour || '' }}
          MDH_TRIGGER_SOURCE: ${{ inputs.trigger_source || 'manual' }}
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: |
          args=(--archive bibliography/apps/web/public/archive/news.json --limit "$MDH_BATCH_SIZE")
          if [ "$MDH_RETRY_FAILED" = 'true' ]; then args+=(--retry-failed); fi
          python -m mdh_pipeline.gemini_review "${args[@]}"

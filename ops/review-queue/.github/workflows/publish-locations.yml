name: Publicar ubicaciones automáticas
on:
  workflow_run:
    workflows: [Preparar fichas con Gemini, Reevaluar pertinencia de noticias, Revisar noticia]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      validation_only:
        description: 'Ensayo de publicación con recibos existentes; sin llamadas a Gemini ni a fuentes'
        type: boolean
        default: false
      source_check_limit:
        description: 'Fuentes seleccionadas que se comprobarán para el mapa; no llama a Gemini'
        type: choice
        default: '50'
        options: ['20', '50']
      automatic_validation_limit:
        description: 'Techo de llamadas por lotes; el reparto compartido determina cuántas pueden ejecutarse'
        type: choice
        default: '50'
        options: ['1', '2', '3', '5', '10', '50']
permissions:
  contents: read
concurrency:
  group: editorial-inbox
  cancel-in-progress: false
  queue: max
jobs:
  publish:
    name: Preparar snapshot público sin credencial de publicación
    permissions:
      contents: write
      issues: read
    outputs:
      base_sha: ${{ steps.public_base.outputs.sha }}
      evaluation_failed: ${{ steps.automatic_validation.outcome == 'failure' }}
    # A failed extractor may have already saved valid batches. Revalidate those
    # main-branch documents; never consume failed-run code, logs or artifacts.
    if: >-
      github.event.repository.private == true && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'success' ||
      (github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.name == 'Preparar fichas con Gemini' &&
      github.event.workflow_run.path == '.github/workflows/extract.yml'))))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: RauPro/MDH-SV
          ref: MDH_PUBLIC_CODE_REF
          path: monitor
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: inbox
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Instalar entorno fijado
        run: pip install -r monitor/ops/review-queue/requirements.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: RauPro/MDH-SV
          ref: main
          path: publication
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/
            /apps/web/public/
      - name: Comprobar entradas públicas antes de acceder a la cola privada
        id: public_base
        env:
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: |
          python -m mdh_pipeline.publication_snapshot check-inputs --repository publication
          echo "sha=$(git -C publication rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Excluir decisiones editoriales y fichas ya aprobadas
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from mdh_pipeline.review_queue import GitHubInbox
          from mdh_pipeline.gemini_review import editorial_excluded_ids
          from mdh_pipeline.news_requests import withdrawn_ids
          inbox = GitHubInbox(os.environ['GITHUB_REPOSITORY'], os.environ['GH_TOKEN'])
          reviewed = json.loads(Path('publication/data/reviewed/news_dossiers.json').read_text())
          reviewed_ids = {d['candidate_id'] for d in reviewed['dossiers']}
          excluded = editorial_excluded_ids(inbox, imported_ids=reviewed_ids) | withdrawn_ids('publication/data/selection/news_exceptions.json')
          Path('excluded-news.json').write_text(json.dumps(sorted(excluded)))
          Path('excluded-locations.json').write_text(json.dumps(sorted(excluded | reviewed_ids)))
          print(json.dumps({'editorial_withdrawals': len(excluded), 'human_decisions': len(reviewed_ids)}))
          PY
      - name: Seleccionar noticias pertinentes y actualizar el archivo público
        env:
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: |
          python -m mdh_pipeline.history --export-only --candidates-only --data-dir publication/data/history --output candidates.json
          python -m mdh_pipeline.news_selection --drafts inbox/drafts --scope-reviews inbox/scope-reviews --scope-verifications inbox/scope-verifications --scope-rechecks inbox/runtime/news-scope-rechecks.json --archive candidates.json --output publication/data/selection/news.json --reviewed-dossiers publication/data/reviewed/news_dossiers.json --scope-audits publication/data/selection/scope_audits.json --excluded-ids excluded-news.json
          python -m mdh_pipeline.history --export-only --data-dir publication/data/history --selection publication/data/selection/news.json --reviewed-news publication/data/reviewed/news_dossiers.json --output publication/apps/web/public/archive/news.json --excluded-ids excluded-news.json --exceptions publication/data/selection/news_exceptions.json
      - name: Verificar inventario completo y proyectar sólo estados de fichas
        env:
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          root = Path('inbox')
          expected = set(filter(None, subprocess.check_output(['git', '-C', str(root), 'ls-files', '-z', '--', 'drafts/']).decode().split('\0')))
          actual = {str(path.relative_to(root)) for path in (root / 'drafts').iterdir()}
          assert expected == actual and all(re.fullmatch(r'drafts/[a-f0-9]{64}\.json', path) for path in actual), 'Incomplete private draft inventory'
          assert all(not (root / path).is_symlink() for path in actual), 'Invalid private draft inventory'
          subprocess.run(['git', '-C', str(root), 'diff', '--quiet', 'HEAD', '--', 'drafts/'], check=True)
          PY
          python -m mdh_pipeline.news_processing --drafts inbox/drafts --archive publication/apps/web/public/archive/news.json --output publication/apps/web/public/archive/processing.json --snapshot-complete
      - name: Recoger solicitudes de GitHub sin incorporar instrucciones o datos privados
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: python -m mdh_pipeline.news_requests sync --archive publication/apps/web/public/archive/news.json --exceptions publication/data/selection/news_exceptions.json --output request-generations.json
      - name: Validar fichas automáticamente con el presupuesto compartido
        id: automatic_validation
        if: inputs.validation_only != true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
          MDH_GEMINI_BUDGET_CONFIG: ${{ vars.MDH_GEMINI_BUDGET_CONFIG }}
          VALIDATION_LIMIT: ${{ inputs.automatic_validation_limit || '50' }}
          VALIDATION_BATCH_SIZE: '4'
          MDH_ALLOCATION_SOURCE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Preparar fichas con Gemini' && format('{0}', github.event.workflow_run.id) || '' }}
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: python -m mdh_pipeline.automatic_news evaluate --inbox-dir inbox --archive publication/apps/web/public/archive/news.json --excluded-ids excluded-locations.json --request-generations request-generations.json --limit "$VALIDATION_LIMIT" --batch-size "$VALIDATION_BATCH_SIZE"
      - name: Proyectar campos validados y respetar correcciones humanas
        env:
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: python -m mdh_pipeline.automatic_news export --inbox-dir inbox --archive publication/apps/web/public/archive/news.json --reviewed publication/data/reviewed/news_dossiers.json --excluded-ids excluded-news.json --request-generations request-generations.json --automatic-output publication/data/automated/news_dossiers.json --output publication/apps/web/public/archive/dossiers.json
      - name: Recuperar comprobaciones geográficas anteriores
        if: inputs.validation_only != true
        # Only bounded source-check receipts are cached in this private workflow.
        # No source bodies, quotations, personal fields or full drafts enter it.
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: source-location-cache
        continue-on-error: true
        with:
          path: .source-location-cache/source-checks.json
          key: source-location-checks-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: source-location-checks-v1-${{ runner.os }}-
      - name: Comprobar ubicaciones en las fuentes sin exigir una ficha completa
        if: inputs.validation_only != true
        env:
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
          SOURCE_CHECK_LIMIT: ${{ inputs.source_check_limit || '50' }}
        run: python -m mdh_pipeline.automatic_locations --drafts inbox/drafts --archive publication/apps/web/public/archive/news.json --output publication/apps/web/public/archive/locations.json --excluded-ids excluded-locations.json --limit "$SOURCE_CHECK_LIMIT" --cache-file .source-location-cache/source-checks.json
      - name: Validar y empaquetar únicamente archivos públicos
        env:
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: |
          set -euo pipefail
          node monitor/apps/web/scripts/sync-news-publication.mjs --root publication
          node monitor/apps/web/scripts/sync-news-processing.mjs --root publication
          node monitor/apps/web/scripts/check-data.mjs --root publication
          python -m mdh_pipeline.publication_snapshot pack --repository publication --output public-snapshot
      - name: Transferir el snapshot validado al publicador aislado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-news-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-snapshot/
          if-no-files-found: error
          retention-days: 1
      - name: Conservar comprobaciones de fuentes sin cuerpos ni datos personales
        if: inputs.validation_only != true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        continue-on-error: true
        with:
          path: .source-location-cache/source-checks.json
          key: source-location-checks-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
  propose:
    name: Proponer snapshot público en una rama sin acceso a borradores
    needs: publish
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: RauPro/MDH-SV
          ref: MDH_PUBLIC_CODE_REF
          path: monitor
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Instalar detector de secretos desde código aprobado
        run: python monitor/scripts/install_gitleaks.py --destination "$RUNNER_TEMP/mdh-gitleaks" >> "$GITHUB_PATH"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Instalar validador fijado
        run: pip install -r monitor/ops/review-queue/requirements.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: RauPro/MDH-SV
          ref: ${{ needs.publish.outputs.base_sha }}
          path: publication
          fetch-depth: 0
          ssh-key: ${{ secrets.NEWS_LOCATION_PUBLISH_KEY }}
      - name: Mantener sólo datos en el árbol con todos los objetos disponibles
        # checkout's sparse-checkout input also enables a blobless partial fetch.
        # Fetch complete objects first so the offline history scan cannot skip any.
        run: git -C publication sparse-checkout set --no-cone '/data/' '/apps/web/public/'
      - name: Descargar exclusivamente el snapshot de esta ejecución
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-news-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-snapshot
      - name: Aplicar snapshot sobre su base exacta y validar con código aprobado
        env:
          PYTHONPATH: monitor/apps/pipeline/src:monitor/packages/schema/src
        run: |
          python -m mdh_pipeline.publication_snapshot apply --repository publication --snapshot public-snapshot
          node monitor/apps/web/scripts/check-data.mjs --root publication
      - name: Proponer únicamente cambios públicos para comprobación y PR
        env:
          PUBLIC_BASE_SHA: ${{ needs.publish.outputs.base_sha }}
          PUBLICATION_BRANCH: chore/automated-news-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git -C publication config user.name 'github-actions[bot]'
          git -C publication config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C publication add -- data/selection/news.json data/automated/news_dossiers.json apps/web/public/archive/news.json apps/web/public/archive/locations.json apps/web/public/archive/dossiers.json apps/web/public/archive/processing.json
          if git -C publication diff --cached --quiet; then exit 0; fi
          python - <<'PYTHON'
          import os, re, subprocess
          allowed = {'data/selection/news.json', 'data/automated/news_dossiers.json', 'apps/web/public/archive/news.json', 'apps/web/public/archive/locations.json', 'apps/web/public/archive/dossiers.json', 'apps/web/public/archive/processing.json'}
          assert re.fullmatch(r'[a-f0-9]{40}', os.environ['PUBLIC_BASE_SHA'])
          assert re.fullmatch(r'chore/automated-news-[0-9]+-[0-9]+', os.environ['PUBLICATION_BRANCH'])
          base = subprocess.check_output(['git', '-C', 'publication', 'rev-parse', 'HEAD'], text=True).strip()
          assert base == os.environ['PUBLIC_BASE_SHA'], 'Publication base changed'
          for arguments in (['diff', '--cached', '--name-only', '-z'], ['diff', '--name-only', '-z']):
              changed = set(filter(None, subprocess.check_output(['git', '-C', 'publication', *arguments], text=True).split('\0')))
              assert changed <= allowed, 'Unexpected publication path'
          PYTHON
          git -C publication commit -m 'chore: propose validated news dossiers and locations'
          python monitor/scripts/publication_guard.py --repo publication check --ref HEAD
          # SSH push triggers the public CI; its trusted completion controller
          # creates and merges the PR under the normal main rules.
          git -C publication push origin "HEAD:refs/heads/$PUBLICATION_BRANCH"
  report:
    name: Informar evaluación incompleta tras proponer los lotes válidos
    needs: [publish, propose]
    if: always() && needs.publish.outputs.evaluation_failed == 'true'
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1

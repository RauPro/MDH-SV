name: Refresh public news bibliography
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      max_pages:
        description: Máximo de páginas por medio (1 a 1000; reanuda en la siguiente ejecución)
        type: number
        required: true
        default: 150
permissions:
  contents: write
concurrency:
  group: public-news-bibliography
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          npm --prefix apps/web ci
      - name: Read publisher metadata and resume incomplete months
        id: collect
        timeout-minutes: 20
        continue-on-error: true
        env:
          MDH_MAX_PAGES: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.max_pages) || '150' }}
        run: python -m mdh_pipeline.history --max-pages "$MDH_MAX_PAGES"
      - name: Finalize coverage from saved checkpoints
        run: python -m mdh_pipeline.history --export-only
      - name: Verify bibliography publication boundary
        run: |
          pytest -q tests/test_history.py
          npm --prefix apps/web test -- src/newsArchive.test.ts
      - name: Commit bibliography and coverage only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/history/co-latino.json data/history/gatoencerrado.json data/history/factum.json apps/web/public/archive/news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh news bibliography and source coverage'
          git push origin HEAD:main
      - name: Report incomplete collection after preserving progress
        if: steps.collect.outcome == 'failure'
        run: exit 1

name: Verify public monitor
on:
  push:
    branches: [main, 'feat/**', 'bug/**', 'chore/automated-**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned secret scanner
        run: python scripts/install_gitleaks.py --destination "$RUNNER_TEMP/mdh-gitleaks" >> "$GITHUB_PATH"
      - name: Check complete publishable history for secrets
        run: python scripts/publication_guard.py check --ref HEAD
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Install locked JavaScript environment
        run: npm ci --ignore-scripts
      - name: Install reproducible Python environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Validate data, MCP and private publication boundary
        run: |
          python scripts/configure_instance.py --check
          python scripts/audit_release.py
          pytest -q
          python -m mdh_pipeline.publication
          node apps/web/scripts/sync-news-publication.mjs
          git diff --exit-code -- apps/web/public/data
          git diff --exit-code -- apps/web/public/archive/dossiers.json
          git diff --exit-code -- data/automated/news_dossiers.json apps/web/public/archive/locations.json
      - name: Audit and test remote API and MCP
        run: |
          npm audit --audit-level=moderate
          npm run test:api
      - name: Install and audit frontend
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web audit --audit-level=moderate
      - name: Test and build public website
        run: |
          npm --prefix apps/web test
          npm --prefix apps/web run lint
          npm --prefix apps/web run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-website
          path: apps/web/dist
          retention-days: 7

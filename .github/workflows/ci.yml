name: Verify public monitor
on:
  push:
    branches: [main, 'feat/**', 'bug/**', 'chore/automated-**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install pinned secret scanner
        run: python scripts/install_gitleaks.py >> "$GITHUB_PATH"
      - name: Check complete publishable history for secrets
        run: python scripts/publication_guard.py check --ref HEAD
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Prepare the same locked checkout used locally
        run: python scripts/bootstrap.py
      - name: Install the Chromium system libraries for the browser suite
        run: sudo apps/web/node_modules/.bin/playwright install-deps chromium
      - name: Run the same complete checks used locally
        run: .venv/bin/python scripts/check.py --audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-website
          path: apps/web/dist
          retention-days: 7

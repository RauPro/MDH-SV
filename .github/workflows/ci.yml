name: Verify public monitor
on:
  push:
    branches: [main, 'feat/**', 'bug/**', 'chore/automated-**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Install reproducible Python environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Validate data, MCP and private publication boundary
        run: |
          python scripts/audit_release.py
          pytest -q
          python -m mdh_pipeline.publication
          node apps/web/scripts/sync-news-publication.mjs
          git diff --exit-code -- apps/web/public/data
          git diff --exit-code -- apps/web/public/archive/dossiers.json
          git diff --exit-code -- data/automated/news_dossiers.json apps/web/public/archive/locations.json
      - name: Install, audit and test remote API and MCP
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run test:api
      - name: Install and audit frontend
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web audit --audit-level=moderate
      - name: Test and build public website
        run: |
          npm --prefix apps/web test
          npm --prefix apps/web run lint
          npm --prefix apps/web run build
      - uses: actions/upload-artifact@v4
        with:
          name: public-website
          path: apps/web/dist
          retention-days: 7

name: Merge verified public snapshots
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Exact bot-dispatched CI run to verify and promote
        required: true
        type: string
  workflow_run:
    workflows: [Verify public monitor]
    types: [completed]
    branches: ['chore/automated-**']
permissions:
  contents: read
concurrency:
  group: public-snapshot-promotion
  cancel-in-progress: false
  queue: max
jobs:
  promote:
    if: >-
      github.repository == 'RauPro/MDH-SV' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 22
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out trusted controller from the default-branch workflow commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Promote the exact verified data snapshot through protected main
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: apps/pipeline/src
        run: python -m mdh_pipeline.publication_pr

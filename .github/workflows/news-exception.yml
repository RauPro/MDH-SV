name: Apply maintainer news request
on:
  issues:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: public-news-bibliography
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'RauPro/MDH-SV' && github.event.sender.type == 'User' && contains(fromJSON('["news/withdraw","news/restore","news/recheck"]'), github.event.label.name)
    permissions:
      contents: write
      issues: read
      pull-requests: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned secret scanner
        run: python scripts/install_gitleaks.py --destination "$RUNNER_TEMP/mdh-gitleaks" >> "$GITHUB_PATH"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install locked validation environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
          python -m pip check
      - name: Authenticate request and reconcile public projections
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_BRANCH: chore/automated-exception-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python -m mdh_pipeline.history --export-only --candidates-only --output "$RUNNER_TEMP/news-exception-candidates.json"
          python -m mdh_pipeline.news_requests apply-exception --candidates "$RUNNER_TEMP/news-exception-candidates.json"
          python -m mdh_pipeline.history --export-only
          node apps/web/scripts/sync-news-publication.mjs
          node apps/web/scripts/sync-news-processing.mjs
          node apps/web/scripts/check-data.mjs
          git add -- data/selection/news_exceptions.json data/automated/news_dossiers.json apps/web/public/archive/news.json apps/web/public/archive/dossiers.json apps/web/public/archive/locations.json apps/web/public/archive/processing.json
          if git diff --cached --quiet; then exit 0; fi
          git switch -c "$PUBLICATION_BRANCH"
          git commit -m 'fix: apply authenticated news request and reconcile publication'
          python scripts/publication_guard.py check --ref HEAD
          git push origin "HEAD:refs/heads/$PUBLICATION_BRANCH"
          python -m mdh_pipeline.publication_pr propose --kind exception --branch "$PUBLICATION_BRANCH"

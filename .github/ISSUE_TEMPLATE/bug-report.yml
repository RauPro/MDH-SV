name: Informe público de error técnico
description: Reportar un fallo reproducible del sitio, la API o el código, sin datos sensibles.
title: Error técnico
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Este informe es público. No incluyas claves, nombres de personas protegidas, testimonios privados ni documentos personales.
        Para correcciones sensibles, retiradas o vulnerabilidades no abras un issue: usa los canales privados que aparecen al elegir el formulario («Corrección sensible o retirada en privado» y «Reportar una vulnerabilidad técnica en privado»), descritos en SECURITY.md.
        Para errores de datos del catálogo o de fichas, usa los formularios de corrección específicos.
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir con datos ficticios
      description: Componente afectado, comportamiento esperado y observado. Reproduce el fallo con datos públicos o inventados.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Entorno
      description: Navegador o versión de Node/Python si aplica, y el commit o la fecha de la última comprobación.
    validations:
      required: false
  - type: checkboxes
    id: public_content
    attributes:
      label: Publicación de este informe
      options:
        - label: Entiendo que será público y no incluyo datos sensibles ni una solicitud privada.
          required: true
